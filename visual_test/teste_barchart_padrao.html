<!DOCTYPE html>
<html>

<head>
    <script type="importmap">
        {
            "imports": {
                "d3": "https://esm.sh/d3@6.7.0",
                "d3-path": "https://esm.sh/d3-path@2.0.0",
                "three": "https://esm.sh/three@0.124.0",
                "underscore": "https://esm.sh/underscore@1.9.1",
                "moment": "https://esm.sh/moment@2.24.0"
            }
        }
    </script>

    <script type="module">
        import BarChart from "../src/BarChart.js";

        document.addEventListener("DOMContentLoaded", () => {
            let layout = document.querySelector("#chart");

            // NOVA CONFIGURAÇÃO
            let config = {
                drawStrategy: "scale break perspective",

                // --- Novos Controles Dinâmicos ---
                scaleBreakHiddenRatio: 0.57, // Ajustado para o novo controle
                breakPoint: 0.4,             // Posição da dobra na tela (0.4 = 40% da altura de baixo para cima)
                gapSize: 40,                 // Tamanho/altura da dobra 3D em pixels
                z: 0.81,                     // Profundidade da perspectiva (ajustado para o novo controle)
                startZero: true,             // Garante que o eixo y inferior comece no 0
                color: "#4682B4",            // Cor principal das barras
            };

            // Você não precisa mais passar as variáveis avulsas de "break_inicial" e "breakfinal"
            let barchart = new BarChart(layout, config);

            const base4Data = [
                { Value: 2086.788469112473 },
                { Value: 798.87765686746255 },
                { Value: 85685.42065542887 },
                { Value: 875.6592439886408 },
                { Value: 680.341495589178564 },
                { Value: 555.6272574356251 },
                { Value: 79412.47462722816 },
                { Value: 9878.030571097508 },
                { Value: 420.07647618035685 },
                { Value: 10858.416405323893 },
                { Value: 77412.47462722816 },
                { Value: 634.4914334661673 },
                { Value: 302.267786914083707 },
                { Value: 396.77761749210134 },
                { Value: 7398.659925373594 },
                { Value: 5661.633142901761 }
            ];

            barchart.data(base4Data);
            barchart.redraw();

            // --- CONTROLES DOS SLIDERS ---
            const perspectiveSlider = document.getElementById('perspectiveSlider');
            const perspectiveValue = document.getElementById('perspectiveValue');
            const breakPointSlider = document.getElementById('breakPointSlider');
            const breakPointValue = document.getElementById('breakPointValue');
            const gapSizeSlider = document.getElementById('gapSizeSlider');
            const gapSizeValue = document.getElementById('gapSizeValue');

            // Função para calcular e definir os valores de z e hiddenRatio
            function updatePerspective(sliderValue) {
                const s_norm = sliderValue / 100;

                // Mapeamento linear para Z (0.01 a 2.0)
                const z_min = 0.01, z_max = 2.0;
                const newZ = z_min + s_norm * (z_max - z_min);

                // Mapeamento linear inverso para hiddenRatio (0.95 a 0)
                const hr_min = 0, hr_max = 0.95;
                const newHiddenRatio = hr_max - s_norm * (hr_max - hr_min);

                // Atualiza os valores no barchart
                barchart.settings.z = newZ;
                barchart.settings.scaleBreakHiddenRatio = newHiddenRatio;

                // Atualiza o texto na tela
                perspectiveValue.textContent = `Z: ${newZ.toFixed(2)}, Oculto: ${newHiddenRatio.toFixed(2)}`;
            }

            // Seta os valores iniciais dos sliders a partir da configuração
            // O slider de perspectiva é o mestre agora.
            const initialPerspectiveValue = 40; // Valor inicial (0-100) que corresponde à config
            perspectiveSlider.value = initialPerspectiveValue;
            
            // Seta os valores iniciais dos outros sliders
            breakPointSlider.value = config.breakPoint;
            breakPointValue.textContent = config.breakPoint;
            gapSizeSlider.value = config.gapSize;
            gapSizeValue.textContent = config.gapSize;

            // Chama a função para setar os valores iniciais de perspectiva no gráfico e no texto
            updatePerspective(perspectiveSlider.value);

            perspectiveSlider.addEventListener('input', (e) => {
                const value = Number(e.target.value);
                updatePerspective(value);
                barchart.drawStrategy.data(barchart); // Recalcula as escalas
                barchart.redraw();
            });

            breakPointSlider.addEventListener('input', (e) => {
                const value = Number(e.target.value);
                breakPointValue.textContent = value.toFixed(2);
                barchart.updateScaleBreakPosition(value); // Método já existente que redesenha
            });

            gapSizeSlider.addEventListener('input', (e) => {
                const value = Number(e.target.value);
                gapSizeValue.textContent = value;
                barchart.settings.gapSize = value;
                barchart.drawStrategy.data(barchart); // Recalcula as escalas
                barchart.redraw();
            });
        });
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>
    <header class="bg-slate-200 p-2 ">
        <img class="h-24" src="./Imagem/logo_labvis.svg" alt="">
    </header>

    <main>
        <h1 class="p-4">Optimized bar chart</h1>
        <p class="p-4">Mitigating outlier problems</p>

        <div id="chart" style="height: 600px; width: 90%;"></div>

        <div id="controls" class="p-4 space-y-4">
            <div>
                <label for="perspectiveSlider">Controle de Perspectiva (Z / Proporção Oculta):</label>
                <input type="range" id="perspectiveSlider" min="0" max="100" step="1" value="40">
                <span id="perspectiveValue" class="font-bold">Z: 0.81, Oculto: 0.57</span>
            </div>
            <div>
                <label for="breakPointSlider">Posição da Quebra:</label>
                <input type="range" id="breakPointSlider" min="0.05" max="0.9" step="0.01" value="0.4">
                <span id="breakPointValue" class="font-bold">0.4</span>
            </div>
            <div>
                <label for="gapSizeSlider">Tamanho da Quebra (Gap):</label>
                <input type="range" id="gapSizeSlider" min="10" max="100" step="1" value="40">
                <span id="gapSizeValue" class="font-bold">40</span>
            </div>
        </div>

        <button onclick="downloadSVG()" class="m-4 px-4 py-2 bg-blue-500 text-white rounded">Download SVG</button>
        <button onclick="downloadPNG()" class="m-4 px-4 py-2 bg-green-600 text-white rounded">Download PNG</button>

    </main>

    <script>
        function downloadSVG() {
            const chartDiv = document.getElementById("chart");
            const svg = chartDiv.querySelector("svg");

            if (!svg) {
                alert("SVG não encontrado.");
                return;
            }

            // Clona o SVG e define atributos necessários
            const clonedSvg = svg.cloneNode(true);
            clonedSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(clonedSvg);
            const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "grafico.svg";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const chartDiv = document.getElementById("chart");
            const svg = chartDiv.querySelector("svg");

            if (!svg) {
                alert("SVG não encontrado.");
                return;
            }

            const clonedSvg = svg.cloneNode(true);
            clonedSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(clonedSvg);
            const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = function () {
                const canvas = document.createElement("canvas");
                canvas.width = svg.viewBox.baseVal.width || svg.clientWidth;
                canvas.height = svg.viewBox.baseVal.height || svg.clientHeight;

                const context = canvas.getContext("2d");
                context.fillStyle = "white"; // fundo branco
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0);

                URL.revokeObjectURL(url);
                canvas.toBlob(function (blob) {
                    const link = document.createElement("a");
                    link.download = "grafico.png";
                    link.href = URL.createObjectURL(blob);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, "image/png");
            };

            image.onerror = function () {
                alert("Erro ao converter SVG para imagem.");
            };

            image.src = url;
        }
    </script>

</body>

</html>
