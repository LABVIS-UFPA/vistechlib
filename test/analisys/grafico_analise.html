    // Função de Bootstrap para IC de 95%
    function calculateBootstrapStats(values, iterations = 2000) {
      const n = values.length;
      const mean = d3.mean(values);

      if (n < 2) {
        return { mean: mean, lower: mean, upper: mean };
      }

      const means = [];
      for (let i = 0; i < iterations; i++) {
        let sum = 0;
        for (let j = 0; j < n; j++) {
          const idx = Math.floor(Math.random() * n);
          sum += values[idx];
        }
        means.push(sum / n);
      }
      means.sort((a, b) => a - b);
      const lower = means[Math.floor(0.025 * iterations)];
      const upper = means[Math.floor(0.975 * iterations)];

      return { mean, lower, upper };
    }


    // Adicionado parâmetro orderArray com valor padrão para manter compatibilidade
    function processData(data, columnName, orderArray) {
      // Agrupar por Difficulty e depois Visualization
      const grouped = d3.group(data, d => d.Difficulty, d => d.Visualization);
      
      console.log(grouped);
      const processed = [];

      // Iterar na ordem definida (agora dinâmica)
      (orderArray || []).forEach(diff => {
        if (grouped.has(diff)) {
          const visGroup = grouped.get(diff);
          // Ordenar visualizações alfabeticamente
          const visualizations = Array.from(visGroup.keys()).sort();
          
          visualizations.forEach(vis => {
            const records = visGroup.get(vis);
            let values = records.map(d => d[columnName]);

            const stats = calculateBootstrapStats(values);
            
            processed.push({
              Pergunta: diff, 
              estrategia: vis,
              media: stats.mean,
              IC95_inferior: stats.lower,
              IC95_superior: stats.upper
            });
          });
        }
      });

      return processed;
    }

    function downloadSVG(svgId) {
      const svgElement = document.getElementById(svgId);
      if (!svgElement) {
        console.error("SVG não encontrado");
        return;
      }
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgElement);
      const blob = new Blob([svgString], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = svgId + ".svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- FUNÇÃO DE FILTRO DE QUALIDADE ---
    function filterHighErrorParticipants(data, threshold = 4.0) {
      console.log(`%c INICIANDO FILTRO DE QUALIDADE (Max LogError: ${threshold})`, 'color: orange; font-weight: bold;');

      // 1. Calcular LogError médio por (Participante + Tarefa)
      const stats = {};

      data.forEach(d => {
        if (d.type === 'questionnaire') return;

        const key = `${d.task}_${d.participantId}`;
        if (!stats[key]) stats[key] = { errors: [], total: 0 };

        stats[key].errors.push(d.logError);
        stats[key].total += 1;
      });

      // 2. Identificar quem falhou no critério
      const blacklist = new Set();
      
      Object.keys(stats).forEach(key => {
        const sumError = stats[key].errors.reduce((a, b) => a + b, 0);
        const avgError = sumError / stats[key].total;
        
        if (avgError > threshold) {
          blacklist.add(key);
          const [taskName, pID] = key.split('_');
          console.log(`[REMOVIDO] ${pID} da tarefa '${taskName}' (Avg LogError: ${avgError.toFixed(2)})`);
        }
      });

      // 3. Filtrar o array original
      const cleanData = data.filter(d => {
        if (d.type === 'questionnaire') return true;

        const key = `${d.task}_${d.participantId}`;
        if (blacklist.has(key)) return false;
        
        return true;
      });

      console.log(`Registros Antes: ${data.length} | Depois: ${cleanData.length}`);
      console.log("-----------------------------------------------------------");
      return cleanData;
    }

    function transformData(rawData) {
      const allLogs = [];
      if (!Array.isArray(rawData)) return allLogs;

      rawData.forEach(session => {
        const expData = session.experimentData;
        if (!expData) return;

        const pID = expData.participantId;

        // Process trial blocks
        (expData.blocks || []).forEach(block => {
          const epsilon = 1e-9;
          const answer = Number(block.answerNumber) || 0;
          const correctAnswer = Number(block.correctAnswer) || 0;
          let logError;

          if (correctAnswer === 0) {
            logError = answer === 0 ? 0 : 10; // Atribui um erro grande
          } else {
            logError = Math.abs(Math.log10((answer + epsilon) / (correctAnswer + epsilon)));
          }

          allLogs.push({
            participantId: pID,
            task: block.taskKey,
            type: 'trial',
            diff: block.datasetId,
            vis: block.visualizationId,
            correct: block.isCorrect,
            Reaction_Time_ms: block.timeOnBlockTaskScreenMs,
            logError: logError,
            details: {}
          });
        });

        // Process NASA-TLX blocks
        (expData.blockNasaTlx || []).forEach(tlxBlock => {
          (tlxBlock.visualizations || []).forEach(visTlx => {
            const mental = visTlx.mentalDemand || 0;
            const temporal = visTlx.temporalDemand || 0;
            const perf_raw = visTlx.performance || 0;
            const effort = visTlx.effort || 0;
            const frust = visTlx.frustration || 0;
            const perf_inverted = 100 - perf_raw;
            const workload = (mental + temporal + perf_inverted + effort + frust) / 5.0;

            allLogs.push({
              participantId: pID,
              task: tlxBlock.taskKey,
              type: 'questionnaire',
              vis: visTlx.visualizationId,
              ratings: {
                workload: workload
              }
            });
          });
        });
      });

      return allLogs;
    }

    // --- LÓGICA PRINCIPAL ---
    const jsonFilePath = "../../results.json";

    d3.json(jsonFilePath).then(rawJsonData => {
      console.log(`Carregado ${rawJsonData.length} registros de: ${jsonFilePath}`); 
      // const filteredLogs = allLogs; // Descomente esta linha para desativar o filtro de acurácia

      const allLogs = transformData(rawJsonData);
      const filteredLogs = filterHighErrorParticipants(allLogs, 4.0);

      const TASKS = ['T1', 'T2', 'T3', 'T4', 'T5'];
      const TASK_MAP = {
        'T1': 'T1 (Valor Exato)',
        'T2': 'T2 (Diferença Distante)',
        'T3': 'T3 (Diferença Próxima)',
        'T4': 'T4 (Proporção Distante)',
        'T5': 'T5 (Proporção Próxima)'
      };

      const plotWidth = 350;
      const timeControleWidth = 190;
      const accControleWidthDefault = 340;
      const accWidthDefault = accControleWidthDefault + plotWidth + 40;
      const totalWidthDefault = accWidthDefault + timeControleWidth + plotWidth;

      TASKS.forEach(taskKey => {
        const taskTrialData = filteredLogs.filter(d => d.task === taskKey && d.type === 'trial');
        const svg = d3.select(`#chart-${taskKey.toLowerCase()}`);

        if (taskTrialData.length === 0) {
          svg.attr("width", 400).attr("height", 50);
          svg.append("text").attr("x", 10).attr("y", 30).text(`⚠️ Sem dados para a tarefa '${taskKey}'.`).style("fill", "red");
          return;
        }

        const mappedTaskData = taskTrialData.map(d => {
          return {
            Difficulty: 'Geral',
            Visualization: d.vis,
            LogError: d.logError,
            Time_s: d.Reaction_Time_ms / 1000
          };
        });

        const difficultyOrder = [...new Set(mappedTaskData.map(d => d.Difficulty))].sort();

        const errorData = processData(mappedTaskData, 'LogError', difficultyOrder);
        const timeData = processData(mappedTaskData, 'Time_s', difficultyOrder);
        const height = 30 * Math.max(errorData.length, 1) + 80;

        svg.attr("width", totalWidthDefault).attr("height", height);
        renderErrorChart(svg, errorData, 0, totalWidthDefault, { col1Header: "Agrupado", significant: [] });
        renderTimeChart(svg, timeData, accWidthDefault, { significant: [] });
      });

      // --- RENDERIZAÇÃO GRÁFICO QUESTIONNAIRE ---
      const questLogs = filteredLogs.filter(d => d.type === 'questionnaire');
      const svgQuest = d3.select("#chart-questionnaire");

      if (questLogs.length > 0) {
        const questData = questLogs.map(d => ({
          Difficulty: TASK_MAP[d.task] || d.task,
          Visualization: d.vis,
          Response: d.ratings.workload
        }));

        const questOrder = TASKS.map(t => TASK_MAP[t]);
        const processedQuestData = processData(questData, 'Response', questOrder);

        const accControleWidthQuest = 380;
        const totalWidthQuest = accControleWidthQuest + plotWidth + 40;
        const heightQuest = 30 * Math.max(processedQuestData.length, 1) + 80;

        svgQuest.attr("width", totalWidthQuest).attr("height", heightQuest);
        renderSubjectiveChart(svgQuest, processedQuestData, totalWidthQuest, {
          controlewidth: accControleWidthQuest,
          col1Header: "Task"
        });
      }

    }).catch(error => {
      console.error("Erro ao carregar o JSON:", error);
      d3.select("body").insert("p", ":first-child")
        .style("color", "red")
        .style("font-weight", "bold")
        .text(`Erro ao carregar: ${jsonFilePath}. Verifique se a pasta 'analysis/results' existe e contém dados.`);
    });
    
  </script>
</body>

</html>
