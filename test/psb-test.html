<!DOCTYPE html>
<html lang="pt-BR" style="width:100%;height:100%;">

<head>
    <meta charset="UTF-8" />
    <title>Perspective Scale Break Bar Chart - Vistechlib</title>
    <script src="bundle.js"></script>
</head>

<body style="width:100%;height:100%;margin:0;font-family:Arial, sans-serif;">

    <div style="padding:12px; display:flex; align-items:center; justify-content:space-between;">

        <div style="display:flex; align-items:center; gap:10px;">
            <label for="depth">Profundidade da dobra:</label>
            <input id="depth" type="range" min="0" max="50" step="0.2" value="8" />
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <label for="cameraMode">Câmera:</label>
            <select id="cameraMode">
                <option value="perspective" selected>Perspectiva</option>
                <option value="orthographic">Ortográfica</option>
            </select>
        </div>

        <button id="btnReset">Resetar</button>
        <button id="btnToggleAutoReturn">Auto retorno: OFF</button>
    </div>

    <div id="canvasTest" style="width:100%;height:calc(100% - 52px);"></div>

    <script>
        const data = [
            // Gases inertes
            { label: 'A', value: 33 },
            { label: 'B', value: 1150 },

            // Elementos voláteis
            { label: 'C', value: 240 },
            { label: 'D', value: 1150 },
            { label: 'E', value: 1760 },
            { label: 'F', value: 910 },
            { label: 'G', value: 47 },
            { label: 'H', value: 36 },
            { label: 'I', value: 85 },

            // Elementos com volatilidade intermediária
            { label: 'J', value: 115 },
            { label: 'K', value: 10 },
            { label: 'L', value: 168 },
            { label: 'M', value: 73 },
            { label: 'N', value: 240 },

            // Elementos refratários
            { label: 'O', value: 84 },
            { label: 'P', value: 72 },
            { label: 'Q', value: 84 },
            { label: 'R', value: 50 },
            { label: 'S', value: 400 }
        //     { label: 'T', value: 0.015 },
        //     { label: 'U', value: 0.013 },
        //     { label: 'V', value: 0.018 },
        //     { label: 'W', value: 2.6 },
        //     { label: 'X', value: 0.00004 },
        //     { label: 'Y', value: 0.4 }
        ];

        const chart = new vistechlib.PerspectiveScaleBreakBarChart(
            document.getElementById('canvasTest'),
            {
                size_type: 'fit',
                valueKey: 'value',
                labelKey: 'label',
                depth: 8,
                cameraMode: 'perspective',
                maxDepth: 50,
                outlierRatioThreshold: 3
            }
        );

        chart.data(data);

        const depthSlider = document.getElementById('depth');
        const cameraModeSelect = document.getElementById('cameraMode');

        chart.depthSlider = depthSlider;

        depthSlider.addEventListener('input', function (event) {
            chart.updateDepth(Number(event.target.value));
        });

        cameraModeSelect.addEventListener('change', function (event) {
            chart.setCameraMode(event.target.value);
        });

        document.getElementById('btnReset').addEventListener('click', function () {
            chart._returnToInitialRotation();
        });

        const btnToggleAutoReturn = document.getElementById('btnToggleAutoReturn');

        btnToggleAutoReturn.addEventListener('click', function () {
            chart.autoReturnEnabled = !chart.autoReturnEnabled;

            btnToggleAutoReturn.innerText = chart.autoReturnEnabled
                ? 'Auto retorno: ON'
                : 'Auto retorno: OFF';
        });

        window.addEventListener('resize', function () {
            chart.resize();
        });
    </script>
</body>

</html>
