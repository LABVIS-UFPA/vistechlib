<!DOCTYPE html>
<html lang="pt-BR" style="width:100%;height:100%;">

<head>
    <meta charset="UTF-8" />
    <title>Perspective Scale Break Bar Chart - Vistechlib</title>
    <script src="bundle.js"></script>
</head>

<body style="width:100%;height:100%;margin:0;font-family:Arial, sans-serif;">

    <div style="padding:12px; display:flex; align-items:center; justify-content:space-between;">

        <div style="display:flex; align-items:center; gap:10px;">
            <label for="depth">Profundidade da dobra:</label>
            <input id="depth" type="range" min="0" max="50" step="0.2" value="8" />
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <label for="cameraMode">Câmera:</label>
            <select id="cameraMode">
                <option value="perspective" selected>Perspectiva</option>
                <option value="orthographic">Ortográfica</option>
            </select>
        </div>

        <button id="btnReset">Resetar</button>
    </div>

    <div id="canvasTest" style="width:100%;height:calc(100% - 52px);"></div>

    <script>
        const data = [
            { label: 'A', value: 4 },
            { label: 'B', value: 2.4 },
            { label: 'C', value: 2.3 },
            { label: 'D', value: 65.5 },
            { label: 'E', value: 0.5 },
            { label: 'F', value: 0.4 },
            { label: 'G', value: 0.1 },
            { label: 'H', value: 1.7 },
            { label: 'I', value: 0.6 },
            { label: 'J', value: 0.9 },
            { label: 'K', value: 1.6 },
            { label: 'L', value: 0.7 },
            { label: 'M', value: 0.4 },
            { label: 'N', value: 1.1 }
        ];

        const chart = new vistechlib.PerspectiveScaleBreakBarChart(
            document.getElementById('canvasTest'),
            {
                size_type: 'fit',
                valueKey: 'value',
                labelKey: 'label',
                depth: 8,
                cameraMode: 'perspective',
                maxDepth: 50,
                outlierRatioThreshold: 3
            }
        );

        chart.data(data);

        const depthSlider = document.getElementById('depth');
        const cameraModeSelect = document.getElementById('cameraMode');

        depthSlider.addEventListener('input', function (event) {
            chart.updateDepth(Number(event.target.value));
        });

        cameraModeSelect.addEventListener('change', function (event) {
            chart.setCameraMode(event.target.value);
        });

        // AÇÃO DO BOTÃO
        document.getElementById('btnReset').addEventListener('click', function () {
            chart.resetView();
        });

        window.addEventListener('resize', function () {
            chart.resize();
        });
    </script>
</body>

</html>
